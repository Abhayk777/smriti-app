# Lowered from -Xmx8G/-XX:MaxMetaspaceSize=4G: with the A11 reminder plugins
# added, the Gradle daemon exhausted native memory on this machine and the JVM
# died mid-build ("Gradle build daemon disappeared unexpectedly"). Reserving
# less heap leaves room for the native allocations the daemon needs.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
