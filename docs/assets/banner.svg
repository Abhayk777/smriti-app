<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Smriti — a calm, offline-first Flutter app for an elder living with dementia">
  <title>Smriti</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#F5EEE2"/>
      <stop offset="55%" stop-color="#F8F1E6"/>
      <stop offset="100%" stop-color="#ECE2D1"/>
    </linearGradient>
    <radialGradient id="pool1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BF5537" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#BF5537" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D79E34" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#D79E34" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#477A55" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#477A55" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="260" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#sky)"/>

    <!-- the living background: three pools of warm light, drifting -->
    <circle cx="160" cy="70" r="260" fill="url(#pool1)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 90 34; -30 18; 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="120" r="220" fill="url(#pool2)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; -70 26; 40 -20; 0 0" dur="31s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="290" r="300" fill="url(#pool3)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 60 -26; -60 12; 0 0" dur="37s" repeatCount="indefinite"/>
    </circle>

    <!-- the weave -->
    <g stroke="#5A2617" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 0h1000M0 0v260" transform="translate(0,0)"/>
    </g>
    <g stroke="#5A2617" stroke-opacity="0.05" stroke-width="1">
      <path d="M8 0v260M20 0v260M32 0v260M44 0v260M56 0v260M68 0v260M80 0v260M92 0v260M104 0v260M116 0v260M128 0v260M140 0v260M152 0v260M164 0v260M176 0v260M188 0v260M200 0v260M212 0v260M224 0v260M236 0v260M248 0v260M260 0v260M272 0v260M284 0v260M296 0v260M308 0v260M320 0v260M332 0v260M344 0v260M356 0v260M368 0v260M380 0v260M392 0v260M404 0v260M416 0v260M428 0v260M440 0v260M452 0v260M464 0v260M476 0v260M488 0v260M500 0v260M512 0v260M524 0v260M536 0v260M548 0v260M560 0v260M572 0v260M584 0v260M596 0v260M608 0v260M620 0v260M632 0v260M644 0v260M656 0v260M668 0v260M680 0v260M692 0v260M704 0v260M716 0v260M728 0v260M740 0v260M752 0v260M764 0v260M776 0v260M788 0v260M800 0v260M812 0v260M824 0v260M836 0v260M848 0v260M860 0v260M872 0v260M884 0v260M896 0v260M908 0v260M920 0v260M932 0v260M944 0v260M956 0v260M968 0v260M980 0v260M992 0v260"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1">
      <path d="M0 8h1000M0 20h1000M0 32h1000M0 44h1000M0 56h1000M0 68h1000M0 80h1000M0 92h1000M0 104h1000M0 116h1000M0 128h1000M0 140h1000M0 152h1000M0 164h1000M0 176h1000M0 188h1000M0 200h1000M0 212h1000M0 224h1000M0 236h1000M0 248h1000"/>
    </g>

    <!-- the gamosa's woven edge, down the left -->
    <rect x="0" y="0" width="14" height="260" fill="#A8322A"/>
    <g fill="#FFF8ED" opacity="0.55">
      <rect x="3" y="16"  width="8" height="4"/><rect x="3" y="38"  width="8" height="4"/>
      <rect x="3" y="60"  width="8" height="4"/><rect x="3" y="82"  width="8" height="4"/>
      <rect x="3" y="104" width="8" height="4"/><rect x="3" y="126" width="8" height="4"/>
      <rect x="3" y="148" width="8" height="4"/><rect x="3" y="170" width="8" height="4"/>
      <rect x="3" y="192" width="8" height="4"/><rect x="3" y="214" width="8" height="4"/>
      <rect x="3" y="236" width="8" height="4"/>
    </g>

    <!-- the lamp -->
    <g transform="translate(74,58) scale(0.86)">
      <circle cx="80" cy="66" r="50" fill="#D79E34" opacity="0.18">
        <animate attributeName="r" values="46;56;46" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <path d="M80 34c9 11 14 19 14 27a14 14 0 0 1-28 0c0-8 5-16 14-27z" fill="#D79E34">
        <animate attributeName="opacity" values="1;0.85;1" dur="1.9s" repeatCount="indefinite"/>
      </path>
      <ellipse cx="80" cy="66" rx="4.5" ry="7" fill="#FFF8ED" opacity="0.9">
        <animate attributeName="ry" values="7;5.4;7" dur="1.2s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M34 82h92c0 20-20 34-46 34S34 102 34 82z" fill="#8C3A24"/>
      <path d="M34 82h92a6 6 0 0 1-6 6H40a6 6 0 0 1-6-6z" fill="#BF5537"/>
    </g>

    <!-- wordmark -->
    <g font-family="Georgia, 'Times New Roman', serif">
      <text x="262" y="126" font-size="82" font-weight="bold" fill="#26211D" letter-spacing="2">
        Smriti
        <animate attributeName="opacity" values="0;1" dur="1.1s" fill="freeze"/>
      </text>
      <text x="266" y="166" font-size="23" fill="#5E554D" font-family="Segoe UI, Helvetica, Arial, sans-serif">
        স্মৃতি &#160;·&#160; smṛti &#160;·&#160; “that which is remembered”
        <animate attributeName="opacity" values="0;0;1" dur="2.1s" fill="freeze"/>
      </text>
      <text x="266" y="204" font-size="19" fill="#8C3A24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">
        A calm, offline-first tablet companion for an elder living with dementia
        <animate attributeName="opacity" values="0;0;0;1" dur="3s" fill="freeze"/>
      </text>
    </g>

    <!-- the rule that closes a header, drawn left to right -->
    <rect x="262" y="222" width="0" height="3" rx="1.5" fill="#BF5537" opacity="0.5">
      <animate attributeName="width" values="0;640" dur="1.6s" begin="0.6s" fill="freeze"/>
    </rect>
  </g>
</svg>
